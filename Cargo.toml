[package]
name = "ogc-dggs-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing geoinsight's OGC API - DGGS as tools"

[dependencies]
rmcp = { version = "3.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
tokio-util = "0.7"
anyhow = "1"
urlencoding = "2"
futures = "0.3"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
